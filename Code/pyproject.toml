[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-decision-agent"
version = "0.1.0"
description = "Three-source evidence fusion and daily reporting agents for the 2026 challenge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "openpyxl>=3.1,<4", "pydantic>=2.10,<3", "PyMuPDF>=1.25,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fusion-agent = "fusion_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

